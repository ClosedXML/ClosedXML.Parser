name: Pre-release

# Builds and publishes a pre-release package from the current branch head. The
# version is computed by MinVer from the latest `v*` tag plus the commit height,
# with the chosen label: v2.1.0 tag + 3 commits + "beta" => 2.1.1-beta.3.
# No git tag and no GitHub Release are created.

on:
  workflow_dispatch:
    inputs:
      prerelease-label:
        description: 'Pre-release label (alpha, beta, rc)'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - beta
          - rc
      dry-run:
        description: 'Dry run (build, pack — skip NuGet publish)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  prerelease:
    runs-on: ubuntu-latest

    env:
      MinVerDefaultPreReleaseIdentifiers: ${{ inputs.prerelease-label }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Show inputs
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Pre-release label: ${{ inputs.prerelease-label }}"

      - name: Restore dependencies
        run: dotnet restore src/ClosedXML.Parser.sln

      - name: Build
        run: dotnet build src/ClosedXML.Parser.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test src/ClosedXML.Parser.Tests/ClosedXML.Parser.Tests.csproj
          --configuration Release
          --no-build

      - name: Pack
        run: dotnet pack src/ClosedXML.Parser/ClosedXML.Parser.csproj --configuration Release --no-build --output ./artifacts

      - name: Show package version
        run: ls -la ./artifacts/

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 7
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

      - name: NuGet login
        if: ${{ inputs.dry-run == false }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: jafin

      - name: Push to NuGet
        if: ${{ inputs.dry-run == false }}
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Push symbols to NuGet
        if: ${{ inputs.dry-run == false }}
        run: dotnet nuget push ./artifacts/*.snupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Dry run — skipped NuGet publish
        if: ${{ inputs.dry-run == true }}
        run: echo "Dry run enabled — packages were built but not published to NuGet."
